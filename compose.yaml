services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: pokelab
      POSTGRES_PASSWORD: pokelab_local
      POSTGRES_DB: pokelab
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pokelab -d pokelab']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
